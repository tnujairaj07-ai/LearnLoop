# Render Blueprint configuration for LearnLoop Full-Stack Deployment
databases:
  - name: learnloop-db
    plan: free
    databaseName: learnloop_db
    user: learnloop

services:
  - type: web
    name: learnloop-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && flask --app run.py seed-rich-demo --skip-if-seeded && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: learnloop-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: learnloop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
