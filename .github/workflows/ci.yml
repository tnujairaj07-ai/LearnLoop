name: LearnLoop Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Backend Test Suite & Schema Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: learnloop_test_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Migrations
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/learnloop_test_db
          SECRET_KEY: test-secret-key-12345
          JWT_SECRET_KEY: test-jwt-secret-key-67890
          FRONTEND_URL: http://localhost:5173
        run: |
          cd backend
          flask --app run.py db upgrade

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/learnloop_test_db
          SECRET_KEY: test-secret-key-12345
          JWT_SECRET_KEY: test-jwt-secret-key-67890
          FRONTEND_URL: http://localhost:5173
        run: |
          cd backend
          pytest -v
